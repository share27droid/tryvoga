name: Attack feature pipeline tests

on:
  push:
    branches:
      - analysis/kyiv-school-daily-features
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attack-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run attack, source-audit, school-label, historical-data, and publication-time tests
        run: python -m unittest -v test_attack_pipeline.py test_tryvoga_sources.py test_tryvoga_school_labels.py test_audit_school_daily.py test_enrich_attack_publication_times.py
      - name: Audit committed tryvoga CSV exports
        run: python audit_tryvoga_sources.py --output /tmp/tryvoga_sources_qa.json
      - name: Audit Kyiv daily labels against source intervals
        run: python audit_school_daily.py --output /tmp/kyiv_school_daily_audit.json
