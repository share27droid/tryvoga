name: Attack feature pipeline tests

on:
  push:
    branches:
      - analysis/kyiv-school-daily-features
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attack-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run attack pipeline and source audit regression tests
        run: python -m unittest -v test_attack_pipeline.py test_tryvoga_sources.py
